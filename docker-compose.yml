services:
  api:
    container_name: payment_gateway_api
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      BANK_URL: http://bank_simulator:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-gateway}@postgres:5432/${POSTGRES_DB:-payment_gateway}
      TEST_BANK_URL: http://bank_simulator:8080
      TEST_MOUNTEBANK_URL: http://bank_simulator:2525
      TEST_DATABASE_URL: postgresql://${TEST_POSTGRES_USER:-gateway}:${TEST_POSTGRES_PASSWORD:-gateway}@test_db:5432/${TEST_POSTGRES_DB:-payment_gateway_test}
    depends_on:
      postgres:
        condition: service_healthy
      bank_simulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/liveness')"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    container_name: payment_gateway_db
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-payment_gateway}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway database for integration tests: `make test-db-up`.
  # The "test" profile keeps it out of a plain `docker compose up`; data lives
  # in tmpfs (and fsync is off), so it is fast and empty after every restart.
  test_db:
    container_name: payment_gateway_test_db
    image: postgres:18-alpine
    profiles: ["test"]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-payment_gateway_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
      - "8081-8082:8081-8082"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

volumes:
  postgres_data:
