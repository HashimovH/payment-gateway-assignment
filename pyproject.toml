[tool.poetry]
name = "payment-gateway-api"
version = "0.1.0"
description = "Payment Gateway API"
authors = ["Author <hasimhasimov27@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.15"
uvicorn = "^0.54.0"
gunicorn = "^27.0.0"
fastapi = "^0.162.4"
pydantic = "^2.14.3"
httpx = "^0.28.1"
pydantic-settings = "^2.16.2"
sqlalchemy = {version = "^2.1.8", extras = ["asyncio"]}
alembic = "^1.20.1"
asyncpg = "^0.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
requests = "^2.34.2"
ruff = "^0.17.4"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the test database and bank simulator (make test-db-up)",
]

[tool.coverage.run]
source = ["payment_gateway_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
